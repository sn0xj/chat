<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Call</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="call-stage">
      <div id="activeCallShell" class="active-call-shell" hidden>
        <div class="active-call-shell__media">
          <div
            id="participantCountBadge"
            class="participant-count-badge"
            role="button"
            tabindex="0"
            aria-live="polite"
            aria-label="Участников в комнате: 1"
            aria-expanded="false"
            aria-controls="participantListPopover"
          >
            <span class="material-symbols-outlined participant-count-badge__icon" aria-hidden="true">group</span>
            <span id="participantCountValue" class="participant-count-badge__value">1</span>
          </div>
          <aside id="participantListPopover" class="participant-list-popover" hidden aria-label="Список участников">
            <div class="participant-list-popover__header">
              <span>Участники</span>
              <span id="participantListCount" class="participant-list-popover__count">1</span>
            </div>
            <ul id="participantListItems" class="participant-list-popover__items"></ul>
          </aside>
          <section id="participantGrid" class="participant-grid" aria-label="Участники">
            <article class="participant-tile participant-tile--local">
              <span class="participant-name">Вы</span>
              <video id="localVideo" autoplay playsinline muted></video>
              <video id="localShareVideo" class="participant-tile__local-share" autoplay playsinline muted hidden></video>
              <div class="participant-tile__fallback" hidden>
                <div class="participant-tile__avatar" aria-hidden="true">В</div>
                <span class="participant-tile__fallback-name">Вы</span>
              </div>
              <div class="participant-status" aria-live="polite"></div>
            </article>
          </section>
        </div>

        <aside id="inviteAside" class="invite-aside" aria-label="Приглашение">
          <p class="invite-aside__lead">
            Чтобы пригласить других участников, отправьте им ссылку на встречу
          </p>
          <button type="button" id="copyInviteMain" class="invite-aside__cta">Скопировать ссылку</button>
          <p id="inviteCopyFeedback" class="invite-aside__feedback" hidden>Ссылка скопирована</p>
          <div class="invite-aside__meeting">
            <span class="invite-aside__meeting-label">Встреча №</span>
            <code id="meetingIdDisplay" class="invite-aside__meeting-code"></code>
            <button type="button" id="copyMeetingMini" class="invite-aside__mini-copy" title="Копировать ссылку" aria-label="Копировать ссылку">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
                />
              </svg>
            </button>
          </div>
        </aside>
      </div>

      <div id="prejoinPanel" class="prejoin-panel">
        <div class="prejoin-card">
          <h1 class="prejoin-title">Video call</h1>
          <p class="prejoin-room">Room: <code id="roomLabel"></code></p>
          <button type="button" id="startCallButton" class="prejoin-join-btn">Подключиться</button>
          <button type="button" id="copyInvitePrejoin" class="prejoin-copy-btn">Скопировать ссылку</button>
        </div>
      </div>
    </main>

    <nav id="callControls" class="control-bar call-controls" hidden aria-label="Управление звонком">
      <button type="button" id="copyInviteButton" class="control-btn control-btn--mui-icon" title="Ссылка" aria-label="Скопировать ссылку">
        <span class="material-symbols-outlined" aria-hidden="true">add</span>
      </button>
      <button type="button" id="toggleShareButton" class="control-btn control-btn--mui-icon" disabled title="Демонстрация экрана" aria-label="Демонстрация экрана">
        <span class="material-symbols-outlined" aria-hidden="true">screen_share</span>
      </button>
      <button type="button" id="toggleMicButton" class="control-btn control-btn--mui-icon" disabled title="Микрофон" aria-label="Микрофон">
        <span class="material-symbols-outlined" aria-hidden="true">mic</span>
      </button>
      <button type="button" id="toggleCamButton" class="control-btn control-btn--mui-icon" disabled title="Камера" aria-label="Камера">
        <span class="material-symbols-outlined" aria-hidden="true">videocam</span>
      </button>
      <button type="button" id="leaveCallButton" class="control-btn control-btn--mui-icon control-btn-danger" disabled title="Выйти" aria-label="Выйти из звонка">
        <span class="material-symbols-outlined" aria-hidden="true">exit_to_app</span>
      </button>
    </nav>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
